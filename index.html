<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel-extremeaccountant</title>
  <style>
    .loader-container {
      display: none;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #dcdfde8c;
      z-index: 9999;
      overflow: hidden;
      pointer-events: all;
    }

    .loader {
      width: 50px;
      aspect-ratio: 1;
      display: grid;
    }

    .loader::before,
    .loader::after {
      content: "";
      grid-area: 1/1;
      --c: no-repeat radial-gradient(farthest-side, #25b09b 92%, #0000);
      background:
        var(--c) 50% 0,
        var(--c) 50% 100%,
        var(--c) 100% 50%,
        var(--c) 0 50%;
      background-size: 12px 12px;
      animation: l12 1s infinite;
    }

    .loader::before {
      margin: 4px;
      filter: hue-rotate(45deg);
      background-size: 8px 8px;
      animation-timing-function: linear
    }

    @keyframes l12 {
      100% {
        transform: rotate(.5turn)
      }
    }
  </style>
</head>

<body>
  <div class="loader-container" id="loader">

    <div class="loader"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
